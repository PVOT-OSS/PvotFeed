[[annotations]]
path = "gradle/wrapper/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2007-2023 Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["gradlew", "gradlew.bat"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2015 the original authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["app/src/main/assets/packs/*.json", "core/*/src/test/resources/fixtures/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Saalim Quadri <danascape@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"
